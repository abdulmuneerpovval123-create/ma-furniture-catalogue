<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Catalogue Admin · M A Furniture</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus&family=Figtree:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" media="print" onload="this.media='all'">
<link rel="stylesheet" href="../assets/style.css">
<style>
/* Admin layout: walnut top bar, tab row, one working panel; forms reuse catalogue tokens */
.abar{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:var(--walnut);color:var(--on-walnut)}
.abar .wrap{display:flex;align-items:center;gap:8px;min-height:60px}
@media (max-width:520px){.abar .brand small{display:none}.abar .brand b{font-size:16px;letter-spacing:.12em}.abar .btn{padding:6px 11px;font-size:13px}}
.abar .brand b{color:var(--on-walnut);font-size:19px}
.abar .brand small{color:var(--brass)}
.abar .grow{flex:1}
.abar .btn{background:transparent;color:var(--on-walnut);border-color:color-mix(in srgb,var(--on-walnut) 30%,transparent);min-height:38px;padding:6px 14px;font-size:14px}
.abar .btn:hover{border-color:var(--brass)}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-block:12px;scrollbar-width:none;border-bottom:1px solid var(--line)}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;min-height:40px;padding:8px 16px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:600;cursor:pointer;color:var(--ink)}
.tabs button[aria-selected="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.panel{padding-block:24px 80px}
.phead{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:end;justify-content:space-between;margin-bottom:18px}
.phead h1{font-size:clamp(28px,4vw,40px)}
.phead p{margin:6px 0 0;color:var(--muted);max-width:60ch}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tools input,.tools select{min-height:42px;width:auto;min-width:0}
.tools input[type=search]{width:min(260px,100%)}
.status{font-size:13px;color:var(--muted)}
.pill-live{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;background:color-mix(in srgb,#2E7D4F 14%,transparent);color:#2E7D4F}
.pill-off{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;background:var(--sunk);color:var(--muted)}
.thumb{width:56px;height:42px;border-radius:6px;object-fit:cover;background:var(--sunk);display:block}
.otable table{min-width:760px}
/* gate */
.gate{min-height:100dvh;display:grid;place-items:center;padding-block:32px}
.gatebox{width:min(460px,100%);background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:clamp(22px,4vw,34px);display:grid;gap:16px;box-shadow:var(--shadow)}
.gatebox h1{font-size:30px}
.gatebox p{margin:0;color:var(--muted);font-size:14.5px}
.gatebox .brandline{font:400 20px var(--f-display);letter-spacing:.18em}
.help{font-size:13px;color:var(--muted);margin:0}
.help a{color:var(--brass-ink)}
.warn{padding:10px 12px;border-radius:8px;background:var(--brass-soft);color:var(--brass-ink);font-size:13.5px}
/* editor */
.ed{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:980px){.ed{grid-template-columns:1fr}}
.box{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:clamp(16px,2.4vw,24px);display:grid;gap:14px;min-width:0}
.box h2{font-size:22px}
.box h3{font:500 11px var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--brass-ink);margin:6px 0 0}
.box.private{border-color:var(--brass);background:color-mix(in srgb,var(--brass-soft) 55%,var(--surface))}
.row3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:620px){.row3{grid-template-columns:1fr}}
.hint{font-weight:400;color:var(--muted);font-size:12.5px}
textarea.tall{min-height:130px}
.kv{display:grid;gap:8px}
.kv .r{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2fr) 40px;gap:8px;align-items:center}
.kv .r.o{grid-template-columns:minmax(0,1fr) minmax(0,2fr) 40px}
.kv input{min-height:40px;padding:8px 10px}
.iconbtn{width:40px;height:40px;border-radius:8px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:18px;line-height:1;color:var(--ink)}
.iconbtn:hover{border-color:#B3261E;color:#B3261E}
.addrow{justify-self:start;min-height:36px;padding:6px 12px;font-size:13px}
.imgs{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
.imgs figure{margin:0;position:relative;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--sunk)}
.imgs figure.first{outline:2px solid var(--brass);outline-offset:-2px}
.imgs img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block}
.imgs figcaption{display:flex;gap:4px;padding:6px;background:var(--surface);flex-wrap:wrap}
.imgs figcaption button{flex:1;border:1px solid var(--line);background:var(--bg);border-radius:6px;font-size:12px;padding:4px 6px;cursor:pointer;color:var(--ink)}
.imgs .new{position:absolute;top:6px;left:6px;font:500 10px var(--f-mono);background:var(--brass);color:var(--surface);padding:2px 6px;border-radius:99px}
.drop{display:grid;place-items:center;gap:6px;min-height:110px;border:1.5px dashed var(--line);border-radius:10px;background:var(--bg);text-align:center;padding:12px;cursor:pointer;color:var(--muted);font-size:13.5px}
.drop:hover,.drop.over{border-color:var(--brass);color:var(--brass-ink)}
.checks{display:flex;flex-wrap:wrap;gap:8px 18px}
.checks label{display:flex;flex-direction:row;align-items:center;gap:8px;font-weight:500}
.checks input{width:20px;min-height:20px;height:20px;accent-color:var(--walnut)}
.savebar{position:sticky;bottom:0;z-index:30;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-top:1px solid var(--line);padding:12px 0 calc(12px + env(safe-area-inset-bottom,0px));margin-top:20px}
.savebar .wrap{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.savebar .grow{flex:1}
.btn-danger{color:#B3261E;border-color:color-mix(in srgb,#B3261E 40%,var(--line))}
.btn-danger.armed{background:#B3261E;color:#fff;border-color:#B3261E}
:root[data-theme="dark"] .btn-danger:not(.armed){color:#F2B8B5}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn-danger:not(.armed){color:#F2B8B5}}
.busy{position:fixed;inset:0;z-index:90;display:grid;place-items:center;background:rgba(15,10,6,.45)}
.busy div{background:var(--surface);color:var(--ink);padding:18px 22px;border-radius:12px;box-shadow:var(--shadow);font-weight:600;max-width:min(90vw,380px);text-align:center}
.catcard{display:grid;gap:12px}
.subrows{display:grid;gap:8px}
.subrows .r{display:grid;grid-template-columns:minmax(0,1fr) auto 40px;gap:8px;align-items:center}
.subrows code{font:500 11px var(--f-mono);color:var(--muted)}
.cats{display:grid;gap:16px}
.catbar{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;align-items:center}
.catbar h2{font-size:24px}
.qrgrid .qrcard a.btn{flex:1 1 auto}
.empty{padding:28px;text-align:center;border:1px dashed var(--line);border-radius:12px;color:var(--muted)}
</style>
</head>
<body>
<div id="app"><div class="gate"><div class="gatebox"><div class="brandline">M A FURNITURE</div><p>Loading admin…</p></div></div></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="../assets/qr.js"></script>
<script src="../assets/admin.js"></script>
</body>
</html>
